# NAS 도착 후 Container Manager에서 검증할 접속 점검용 프로젝트입니다.
# 실제 파일 저장소, 비밀번호, Docker 소켓은 연결하지 않습니다.
services:
  cloud-probe:
    image: ghcr.io/nginx/nginx-unprivileged@sha256:56b8272e43a0525f67aed68d1e0794a712d10e3e45a563e118e9a77c817e6f86
    platform: linux/amd64
    user: "101:101"
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cpus: 0.5
    mem_limit: 128m
    mem_reservation: 32m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
